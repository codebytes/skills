id: positive-trigger-002
name: Register an existing skill
description: Register an existing complete skill and add its thumbnail and repository surfaces.
tags:
  - positive-trigger
inputs:
  prompt: "Register this existing skill in the marketplace and add its thumbnail art."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-create-skill
    config:
      skill_path: skills/create-skill/SKILL.md
      mode: positive
      threshold: 0.6
