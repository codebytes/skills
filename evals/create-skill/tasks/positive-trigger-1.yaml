id: positive-trigger-001
name: Create and register a portable skill
description: >-
  Create and register a complete portable agent skill in a managed skills-repo.config.json
  repository or an existing skills repository. Produces focused instructions, documentation,
  deterministic tests, Vally evals, locked tooling, registration, and optional validated
  thumbnail art. Covers: create-skill, create a skill, add an agent skill, scaffold a portable
  skill, register a skill, add skill to managed repo, create skill in existing repo, generate an
  example skill from a fixture, add skill thumbnail art.
tags:
  - positive-trigger
inputs:
  prompt: "Create and register a complete portable agent skill in this managed skills repository."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-create-skill
    config:
      skill_path: skills/create-skill/SKILL.md
      mode: positive
      threshold: 0.6
