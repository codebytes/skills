id: positive-trigger-001
name: Revise a Marp deck
description: >-
  Create and revise Marp decks with reliable slide structure, content transformations, speaker
  notes, layouts, and existing theme styles. Covers: create Marp slides, add a slide, rewrite
  slide content, split or merge slides, reorder a deck, add speaker notes, apply slide layouts,
  restyle slides.
tags:
  - positive-trigger
inputs:
  prompt: "Create Marp slides, split an overcrowded slide, reorder the deck, and add speaker notes."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: triggers-marp-authoring
    config:
      skill_path: skills/marp-authoring/SKILL.md
      mode: positive
      threshold: 0.6
