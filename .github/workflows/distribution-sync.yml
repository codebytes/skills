name: Distribution compatibility

on:
  pull_request:
    paths:
      - ".skills-repo/**"
      - "skills/**"
      - "site/scripts/**"
      - "skills-repo.config.json"
      - "README.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "plugin.json"
      - "marketplace.json"
      - "gemini-extension.json"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "test/**"
      - ".github/workflows/distribution-sync.yml"
  push:
    branches: [main]
    paths:
      - ".skills-repo/**"
      - "skills/**"
      - "site/scripts/**"
      - "skills-repo.config.json"
      - "README.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "plugin.json"
      - "marketplace.json"
      - "gemini-extension.json"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "test/**"
      - ".github/workflows/distribution-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Check generated compatibility views
        run: node .skills-repo/sync.mjs --check
      - name: Validate distribution compatibility
        run: node --test test/*.test.mjs
      - name: Build lean runtime plugin
        run: node .skills-repo/package.mjs
      - name: Retain runtime plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codebytes-skills-runtime
          path: dist/plugin/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
